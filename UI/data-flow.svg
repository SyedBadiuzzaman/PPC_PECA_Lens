<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" role="img" aria-labelledby="title description">
  <title id="title">PPC-PECA Lens data flow</title>
  <desc id="description">The left lane shows PPC and PECA PDFs becoming page chunks, local Legal-BERT vectors, and separate Chroma collections. The right lane shows one browser question passing through input checks and routing, retrieval, generation, citation checks, and a sourced response. The index supplies the retrieval step. Animated arrows show direction; the diagram is readable without motion.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #182019; }
    .canvas { fill: #f8f6ea; }
    .source { fill: #d9d28b; }
    .index { fill: #b2bd7e; }
    .query { fill: #fffef8; }
    .answer { fill: #6a795d; }
    .card { stroke: #8e9162; stroke-width: 2; }
    .title { font-size: 32px; font-weight: 750; letter-spacing: -1px; }
    .lane { font-size: 18px; font-weight: 800; letter-spacing: 1.4px; fill: #4d6144; }
    .name { font-size: 23px; font-weight: 750; }
    .detail { font-size: 17px; fill: #3f493f; }
    .answer-text { fill: #fff; }
    .foot { font-size: 16px; fill: #3f493f; }
    .connector { fill: none; stroke: #6a795d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 7; animation: travel 1s linear infinite; }
    .index-connector { stroke: #8e9162; animation-duration: 1.6s; }
    @keyframes travel { to { stroke-dashoffset: -30; } }
    @media (prefers-reduced-motion: reduce) { .connector { animation: none; stroke-dasharray: none; } }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#6a795d" stroke-width="2"/>
    </marker>
  </defs>

  <rect class="canvas" width="880" height="720" rx="18"/>
  <text class="title" x="28" y="50">Two paths. One traceable answer.</text>
  <text class="lane" x="28" y="121">01  PREPARE PDFs OFFLINE</text>
  <text class="lane" x="480" y="121">02  ANSWER A QUESTION</text>

  <path class="connector" d="M220 221 V254" marker-end="url(#arrow)"/>
  <path class="connector" d="M220 331 V364" marker-end="url(#arrow)"/>
  <path class="connector" d="M220 441 V474" marker-end="url(#arrow)"/>
  <path class="connector" d="M660 221 V254" marker-end="url(#arrow)"/>
  <path class="connector" d="M660 331 V364" marker-end="url(#arrow)"/>
  <path class="connector" d="M660 441 V474" marker-end="url(#arrow)"/>
  <path class="connector" d="M660 551 V584" marker-end="url(#arrow)"/>
  <path class="connector index-connector" d="M400 513 H445 V403 H479" marker-end="url(#arrow)"/>

  <rect class="card source" x="28" y="145" width="372" height="76" rx="12"/>
  <text class="name" x="48" y="177">PPC + PECA PDFs</text>
  <text class="detail" x="48" y="203">Selected physical pages</text>

  <rect class="card query" x="480" y="145" width="372" height="76" rx="12"/>
  <text class="name" x="500" y="177">Browser question</text>
  <text class="detail" x="500" y="203">One standalone POST /query</text>

  <rect class="card source" x="28" y="255" width="372" height="76" rx="12"/>
  <text class="name" x="48" y="287">Extract + chunk</text>
  <text class="detail" x="48" y="313">Passages stay within each page</text>

  <rect class="card query" x="480" y="255" width="372" height="76" rx="12"/>
  <text class="name" x="500" y="287">Check + route</text>
  <text class="detail" x="500" y="313">Local checks; OpenRouter selects law</text>

  <rect class="card source" x="28" y="365" width="372" height="76" rx="12"/>
  <text class="name" x="48" y="397">Local Legal-BERT</text>
  <text class="detail" x="48" y="423">Embeddings from source text</text>

  <rect class="card query" x="480" y="365" width="372" height="76" rx="12"/>
  <text class="name" x="500" y="397">Retrieve three passages</text>
  <text class="detail" x="500" y="423">From the selected collection</text>

  <rect class="card index" x="28" y="475" width="372" height="76" rx="12"/>
  <text class="name" x="48" y="507">Local Chroma index</text>
  <text class="detail" x="48" y="533">Separate PPC and PECA collections</text>

  <rect class="card query" x="480" y="475" width="372" height="76" rx="12"/>
  <text class="name" x="500" y="507">Generate + verify</text>
  <text class="detail" x="500" y="533">Model answer; local quote checks</text>

  <rect class="card answer" x="480" y="585" width="372" height="76" rx="12"/>
  <text class="name answer-text" x="500" y="617">Response in chat</text>
  <text class="detail answer-text" x="500" y="643">Status, pages, quotes, warnings</text>

  <text class="foot" x="28" y="622">Only the source index is persistent.</text>
  <text class="foot" x="28" y="648">No questions or chat turns are saved.</text>
  <text class="foot" x="28" y="697">Animation pauses when reduced motion is preferred.</text>
</svg>
