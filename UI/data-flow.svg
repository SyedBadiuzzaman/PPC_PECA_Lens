<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 630" role="img" aria-labelledby="title description">
  <title id="title">PPC-PECA Lens data flow</title>
  <desc id="description">Offline, the two supplied PDFs are extracted, split into page-bounded chunks, embedded locally, and saved in separate Chroma collections. For each question, the browser sends one request through input checks and routing, retrieves three chunks from the selected collection, then receives a generated answer after quotation checks. Animated connectors show direction; all steps remain visible without animation.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #182019; }
    .canvas { fill: #f8f6ea; }
    .panel { fill: #fffef8; stroke: #8e9162; stroke-width: 2; }
    .source-panel { fill: #d9d28b; }
    .index-panel { fill: #b2bd7e; }
    .query-panel { fill: #fffef8; }
    .result-panel { fill: #6a795d; }
    .result-panel + text, .result-text { fill: #fff; }
    .heading { font-size: 32px; font-weight: 750; letter-spacing: -1px; }
    .lane { font-size: 17px; font-weight: 750; letter-spacing: 2px; fill: #4d6144; }
    .step { font-size: 22px; font-weight: 730; }
    .detail { font-size: 15px; fill: #3f493f; }
    .step-number { font-size: 14px; font-weight: 750; fill: #4d6144; }
    .connector { fill: none; stroke: #6a795d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; animation: travel 1.25s linear infinite; }
    .index-connector { stroke: #8e9162; animation-duration: 1.7s; }
    .return-connector { stroke: #182019; }
    .note { font-size: 15px; fill: #3f493f; }
    @keyframes travel { to { stroke-dashoffset: -34; } }
    @media (prefers-reduced-motion: reduce) { .connector { animation: none; stroke-dasharray: none; } }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#6a795d" stroke-width="2"/>
    </marker>
    <marker id="return-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#182019" stroke-width="2"/>
    </marker>
  </defs>

  <rect class="canvas" width="1260" height="630" rx="20"/>
  <text class="heading" x="40" y="51">From source documents to a cited response</text>
  <text class="lane" x="40" y="96">01  PREPARE THE LOCAL SOURCES</text>
  <text class="note" x="923" y="96">Offline ingestion command</text>

  <path class="connector" d="M270 183 H328" marker-end="url(#arrow)"/>
  <path class="connector" d="M570 183 H628" marker-end="url(#arrow)"/>
  <path class="connector" d="M870 183 H928" marker-end="url(#arrow)"/>
  <path class="connector index-connector" d="M1080 242 V302 H755 V359" marker-end="url(#arrow)"/>

  <rect class="panel source-panel" x="40" y="128" width="230" height="114" rx="12"/>
  <text class="step-number" x="58" y="153">SOURCE</text>
  <text class="step" x="58" y="185">PPC + PECA PDFs</text>
  <text class="detail" x="58" y="211">Selected physical pages</text>

  <rect class="panel" x="340" y="128" width="230" height="114" rx="12"/>
  <text class="step-number" x="358" y="153">EXTRACT</text>
  <text class="step" x="358" y="185">Read and chunk</text>
  <text class="detail" x="358" y="211">Page-bounded passages</text>

  <rect class="panel" x="640" y="128" width="230" height="114" rx="12"/>
  <text class="step-number" x="658" y="153">EMBED</text>
  <text class="step" x="658" y="185">Local Legal-BERT</text>
  <text class="detail" x="658" y="211">Numeric text vectors</text>

  <rect class="panel index-panel" x="940" y="128" width="280" height="114" rx="12"/>
  <text class="step-number" x="958" y="153">STORE LOCALLY</text>
  <text class="step" x="958" y="185">Chroma index</text>
  <text class="detail" x="958" y="211">Separate PPC / PECA sets</text>

  <text class="lane" x="40" y="326">02  ANSWER ONE STANDALONE QUESTION</text>
  <text class="note" x="978" y="326">One request at a time</text>

  <path class="connector" d="M270 416 H328" marker-end="url(#arrow)"/>
  <path class="connector" d="M570 416 H628" marker-end="url(#arrow)"/>
  <path class="connector" d="M870 416 H928" marker-end="url(#arrow)"/>
  <path class="connector return-connector" d="M1080 475 V520" marker-end="url(#return-arrow)"/>

  <rect class="panel query-panel" x="40" y="359" width="230" height="116" rx="12"/>
  <text class="step-number" x="58" y="385">BROWSER</text>
  <text class="step" x="58" y="417">User question</text>
  <text class="detail" x="58" y="444">POST /query</text>

  <rect class="panel query-panel" x="340" y="359" width="230" height="116" rx="12"/>
  <text class="step-number" x="358" y="385">CHECK + ROUTE</text>
  <text class="step" x="358" y="417">Choose one law</text>
  <text class="detail" x="358" y="444">Local checks, model router</text>

  <rect class="panel query-panel" x="640" y="359" width="230" height="116" rx="12"/>
  <text class="step-number" x="658" y="385">RETRIEVE</text>
  <text class="step" x="658" y="417">Top 3 passages</text>
  <text class="detail" x="658" y="444">From selected collection</text>

  <rect class="panel query-panel" x="940" y="359" width="280" height="116" rx="12"/>
  <text class="step-number" x="958" y="385">GENERATE + VERIFY</text>
  <text class="step" x="958" y="417">Answer with citations</text>
  <text class="detail" x="958" y="444">Model reply, local quote checks</text>

  <rect class="result-panel" x="940" y="530" width="280" height="65" rx="12"/>
  <text class="result-text" x="958" y="558" font-size="19" font-weight="730">Shown in the chat</text>
  <text class="result-text" x="958" y="580" font-size="14">Status · pages · quotes · warnings</text>
  <text class="note" x="40" y="555">The index is persistent. Questions and visible chat turns are not stored by the backend.</text>
  <text class="note" x="40" y="580">The browser keeps its transcript only until reload, navigation, or tab closure.</text>
</svg>
