[project]
name = "ppc-peca-lens"
version = "0.1.0"
description = "A source-grounded PPC and PECA legal reference API."
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.0,<2.0",
    "fastapi>=0.110,<1.0",
    "huggingface-hub>=0.25,<3.0",
    "httpx>=0.27,<1.0",
    "langchain>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "pdfplumber>=0.11,<1.0",
    "pydantic>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sentence-transformers>=3.0,<6.0",
    "uvicorn>=0.29,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv]
package = false
